<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habit">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="manifest" href="manifest.json">
<title>Habit</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--sf:#161b22;--s2:#1c2330;
  --b1:rgba(255,255,255,0.08);--b2:rgba(255,255,255,0.18);
  --tx:#e6edf3;--mu:#7d8590;--ac:#c8a96e;
  --gn:#4ade80;--ye:#fbbf24;--rd:#f87171;--bl:#60a5fa;--pu:#c084fc;
  /* row group tints */
  --body:#60a5fa;--mind:#c084fc;--nutr:#4ade80;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;color:var(--tx);
  background:var(--bg);min-height:100vh;-webkit-text-size-adjust:100%;
  padding:0 12px calc(env(safe-area-inset-bottom) + 28px)}
button{font-family:inherit}

.hdr{padding:calc(env(safe-area-inset-top) + 14px) 4px 10px;display:flex;align-items:baseline;gap:10px}
.hdr h1{font-size:18px;font-weight:700}
.hdr span{font-size:12px;color:var(--mu)}

/* ── banner: readiness + ONE do/don't line. Nothing else. ─────── */
.banner{border:1px solid var(--b1);border-radius:12px;padding:12px 14px;margin-bottom:14px;
  display:flex;align-items:center;gap:14px;background:var(--sf)}
.banner .score{font-size:30px;font-weight:800;line-height:1;min-width:52px;text-align:center}
.banner .score small{display:block;font-size:9px;font-weight:600;color:var(--mu);letter-spacing:1px;margin-top:3px}
.banner .line{flex:1;font-size:14px;line-height:1.45;font-weight:600}
.banner .line em{display:block;font-style:normal;font-weight:400;font-size:11.5px;color:var(--mu);margin-top:3px}
.banner.good{border-color:rgba(74,222,128,.45)}
.banner.good .score{color:var(--gn)}
.banner.mid{border-color:rgba(251,191,36,.45)}
.banner.mid .score{color:var(--ye)}
.banner.low{border-color:rgba(248,113,113,.45)}
.banner.low .score{color:var(--rd)}
.banner.none{border-style:dashed}
.banner.none .score{color:var(--mu);font-size:20px}

/* ── week nav ─────────────────────────────────────────────────── */
.wknav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wknav button{width:38px;height:38px;border:1px solid var(--b2);border-radius:9px;background:var(--sf);
  color:var(--tx);font-size:17px;cursor:pointer;flex-shrink:0}
.wknav .lbl{flex:1;text-align:center}
.wknav .lbl b{display:block;font-size:14px;font-weight:700}
.wknav .lbl span{display:block;font-size:11px;color:var(--mu);margin-top:1px}

/* ── the grid ─────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:82px repeat(7,1fr);gap:4px;align-items:stretch}
.gh{font-size:10px;color:var(--mu);text-align:center;text-transform:uppercase;letter-spacing:.8px;
  padding-bottom:4px;font-weight:600}
.gh.today{color:var(--ac);font-weight:800}
.grouplbl{grid-column:1/-1;font-size:9.5px;text-transform:uppercase;letter-spacing:1.4px;font-weight:700;
  margin:12px 0 2px;padding-bottom:3px;border-bottom:1px solid var(--b1)}
.rowlbl{font-size:11.5px;display:flex;align-items:center;gap:5px;padding-right:4px;line-height:1.2}
.rowlbl .aim{font-size:9px;color:var(--mu)}
.cell{height:40px;border-radius:8px;border:1px solid var(--b2);background:var(--s2);color:var(--mu);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  font-size:12px;padding:0;transition:background .12s,border-color .12s}
.cell .v{font-size:12.5px;font-weight:700;line-height:1}
.cell .u{font-size:8px;letter-spacing:.3px;opacity:.75;line-height:1}
.cell.today{border-color:var(--ac)}
.cell.future{opacity:.4}
.cell.on{color:#0d1117;font-weight:800;background:var(--b2)}  /* fallback bg: .on
   flips the text to near-black, so if a group class ever fails to match again the
   cell must still be readable rather than dark-on-dark */
.cell.dim{background:rgba(255,255,255,.04)}
.notebox{margin:18px 0 8px}
.notehdr{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mu);
  font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.notemsg{font-size:10px;text-transform:none;letter-spacing:0;color:var(--mu);font-weight:400}
.notebox textarea{width:100%;padding:9px 11px;border:1px solid var(--b2);border-radius:9px;
  background:var(--s2);color:var(--tx);font-size:15px;font-family:inherit;line-height:1.5;resize:vertical}
/* filled states, per group */
.cell.g-body.on{background:rgba(96,165,250,.85);border-color:#60a5fa}
.cell.g-mind.on{background:rgba(192,132,252,.85);border-color:#c084fc}
.cell.g-nutr.on{background:rgba(74,222,128,.85);border-color:#4ade80}
/* partial fills use a softer tint */
.cell.g-body.part{background:rgba(96,165,250,.30);border-color:rgba(96,165,250,.7);color:#bfdbfe}
.cell.g-mind.part{background:rgba(192,132,252,.30);border-color:rgba(192,132,252,.7);color:#e9d5ff}
.cell.g-nutr.part{background:rgba(74,222,128,.30);border-color:rgba(74,222,128,.7);color:#bbf7d0}
/* alcohol escalates — it is the one row where more is worse */
.cell.alc1{background:rgba(255,220,50,.22);border-color:#ffd932;color:#ffd932}
.cell.alc2{background:rgba(255,185,0,.28);border-color:#ffb900;color:#ffb900}
.cell.alc3{background:rgba(255,130,0,.30);border-color:#ff8200;color:#ff8200}
.cell.alc4{background:rgba(235,80,0,.32);border-color:#eb5000;color:#ff8a5c}
.cell.alc5{background:rgba(248,113,113,.34);border-color:#f87171;color:#f87171}

.foot{margin-top:18px;font-size:11.5px;color:var(--mu);line-height:1.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 20px);
  background:#232b3a;border:1px solid var(--b2);color:var(--tx);padding:10px 16px;border-radius:10px;
  font-size:13px;z-index:600;opacity:0;pointer-events:none;transition:opacity .18s;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--b2);border-top-color:var(--ac);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="hdr"><h1>Habit</h1><span id="hsub"></span></div>
<div id="banner" class="banner none"><div class="score">—</div><div class="line">Readiness loading…</div></div>
<div id="wknav"></div>
<div id="grid" class="grid"></div>
  <div id="notebox" class="notebox"></div>
<div class="foot">
  Tap to advance a cell · long-press to clear it.<br>
  This grid <b>records</b> what happened. Runs are planned in Outlook — deliberately not here.
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   habit — the Mon–Sun record-only grid.

   No streaks, no badges, no chains, no planning. Accountability is
   the coach reading the data, not the app congratulating her. If a
   future version grows a streak counter, that's the bug.

   SIGNED IN since 27 Sep 2026. It was anon + open table (July: "the
   threat model doesn't warrant it") — until it turned out that the
   anon key ships in these public repos, so alcohol, protein and
   wind-down were readable AND writable by anyone who looked. The
   session is golf-coach's own (`gc_session`, same origin), so a
   device signed in there is signed in here. RLS lets only the
   student through: Wes's token reads nothing.
   ═══════════════════════════════════════════════════════════════ */
const SB_URL = 'https://ykbabwkyojlwculjmbrw.supabase.co';   // astrid-efficiency
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrYmFid2t5b2psd2N1bGptYnJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MTg0NzMsImV4cCI6MjA5MjA5NDQ3M30.4lYnVcgv1o9OvXGMtrbjwKhXZ8Yybqln08aci_ZM9mI';

const DAY_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ── ROW DEFINITIONS ──────────────────────────────────────────────
   Each row says how a tap changes the value and how to draw it.
   `col` is the DB column on daily_habits.
──────────────────────────────────────────────────────────────────── */
const RUN_CYCLE = ['', 'z2', 'tempo', 'vo2'];
const RUN_LABEL = {'':'', z2:'Z2', tempo:'TMP', vo2:'VO2'};
const WIND_LABEL = ['', '🙁', '🙂', '😇'];

const GROUPS = [
  {id:'body', label:'Body', tint:'var(--body)', rows:[
    {col:'run_type',    label:'Runs',       kind:'cycle',  cycle:RUN_CYCLE, draw:v=>RUN_LABEL[v||'']||''},
    {col:'weights',     label:'Weights',    kind:'toggle', aim:'2×/wk'},
    {col:'mobility',    label:'Mobility',   kind:'toggle'},
    {col:'stretch',     label:'Stretching', kind:'toggle'},
  ]},
  {id:'mind', label:'Mind', tint:'var(--mind)', rows:[
    {col:'breath',      label:'Breath',     kind:'toggle'},
    {col:'winddown',    label:'Wind-down',  kind:'step3', draw:v=>WIND_LABEL[Number(v)||0]||''},
  ]},
  {id:'nutr', label:'Nutrition', tint:'var(--nutr)', rows:[
    {col:'protein_g',   label:'Protein',    kind:'accrete', step:20, unit:'g',  target:115},
    {col:'water_glasses',label:'Water',     kind:'accrete', step:1,  unit:'gl', target:6},
    {col:'supplements', label:'Supplements',kind:'toggle'},
    {col:'alcohol',     label:'Alcohol',    kind:'accrete', step:1,  unit:'u',  risk:true},
  ]},
];
const ALL_ROWS = GROUPS.flatMap(g => g.rows.map(r => ({...r, group:g.id})));

/* ── helpers ─────────────────────────────────────────────────── */
function el(id){ return document.getElementById(id); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monday(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dow = x.getDay();
  x.setDate(x.getDate() - (dow===0 ? 6 : dow-1));
  return x;
}
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtDay(d){ return d.getDate()+' '+MONTHS[d.getMonth()]; }
function fmtRange(m){ const s=addDays(m,6); return fmtDay(m)+' – '+fmtDay(s)+' '+s.getFullYear(); }
const TODAY = ymd(new Date());

let toastT=null;
function toast(m){ const t=el('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2000); }

/* ── data ────────────────────────────────────────────────────── */
let WEEK = monday(new Date());
let DAYS = {};      // ymd -> row object from daily_habits

/* ── sign-in: golf-coach's session, shared through localStorage ──
   Both apps rotate the same refresh token, so ALWAYS re-read storage
   before trusting or refreshing it — a copy held in memory may have
   been spent by the other app since, and refreshing with a spent
   token is what signs you out. */
const SESS_KEY = 'gc_session';
class NeedSignIn extends Error {}

function readSession(){
  try { return JSON.parse(localStorage.getItem(SESS_KEY) || 'null'); } catch { return null; }
}
function writeSession(s){
  if (!s) { localStorage.removeItem(SESS_KEY); return; }
  localStorage.setItem(SESS_KEY, JSON.stringify({
    access_token: s.access_token, refresh_token: s.refresh_token,
    expires_at: s.expires_at || (Math.floor(Date.now()/1000) + (s.expires_in || 3600)),
  }));
}
async function authFetch(path, body){
  const r = await fetch(SB_URL+'/auth/v1/'+path, {method:'POST',
    headers:{apikey:SB_KEY, 'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || ('HTTP '+r.status));
  return j;
}
async function validToken(){
  const s = readSession();
  if (!s || !s.access_token) return null;
  if (s.expires_at - 60 > Math.floor(Date.now()/1000)) return s.access_token;
  if (!s.refresh_token) return null;
  try {
    writeSession(await authFetch('token?grant_type=refresh_token', {refresh_token: s.refresh_token}));
  } catch {
    // The other app may have refreshed in the meantime: only give up if
    // storage still holds the token that just failed.
    const now = readSession();
    if (now && now.refresh_token !== s.refresh_token) return validToken();
    writeSession(null); return null;
  }
  return readSession().access_token;
}

async function sb(path, {method='GET', body=null, prefer=null}={}){
  const tok = await validToken();
  if (!tok) throw new NeedSignIn('signed out');
  const headers = {apikey:SB_KEY, Authorization:'Bearer '+tok, 'Content-Type':'application/json'};
  if (prefer) headers.Prefer = prefer;
  const r = await fetch(SB_URL+'/rest/v1/'+path, {method, headers, body: body!=null?JSON.stringify(body):undefined});
  if (r.status === 401) throw new NeedSignIn('session rejected');
  if (!r.ok) throw new Error('DB '+r.status+' '+(await r.text().catch(()=>'')).slice(0,160));
  if (r.status===204) return null;
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

async function loadWeek(){
  const a = ymd(WEEK), b = ymd(addDays(WEEK,6));
  const rows = await sb(`daily_habits?select=*&date=gte.${a}&date=lte.${b}`) || [];
  DAYS = {};
  for (const r of rows) DAYS[r.date] = r;

  /* The week's note, with a LOCAL DRAFT as the safety net.

     8 Aug: she typed a week's notes into this box and lost them. The table did
     not exist yet, every save 404'd, and the only warning was a 10px grey
     "not saved" beside the heading. That is an absurd way to tell someone their
     typing is being discarded.

     So the text is now written to localStorage on every keystroke, before any
     network call. If the server has nothing — table missing, offline, request
     failed — the draft comes back and says so plainly. Typed text is the one
     thing in this app that cannot be reconstructed from anywhere else. */
  let remote = null;
  try {
    const n = await sb(`habit_notes?select=note&week_start=eq.${a}`);
    remote = (n && n[0] && n[0].note) || '';
    NOTE_OK = true;
  } catch(e){ NOTE_OK = false; console.warn('habit note unavailable', e); }

  const draft = localStorage.getItem('habitnote_' + a) || '';
  NOTE = (remote && remote.trim()) ? remote : draft;
  NOTE_UNSAVED = !!(draft.trim() && draft !== (remote || ''));
}

/* ── the week's note ─────────────────────────────────────────────
   Her ask, 8 Aug: room to explain a week — the sort of thing a coach
   would otherwise take her apart for without knowing.

   It goes to the SUNDAY COACH, and nowhere near Wes: this app holds
   alcohol, nutrition and mood, and reusing `weekly_notes` would have
   printed it straight into his digest.

   Saved on blur and debounced while typing, because a note you must
   remember to save is a note that gets lost — and this one is written
   at the end of a week, at the exact moment attention is lowest. */
let NOTE = '', noteTimer = null, NOTE_OK = true, NOTE_UNSAVED = false;

function noteMsg(text, bad){
  const m = el('notemsg');
  if (!m) return;
  m.textContent = text;
  m.style.color = bad ? 'var(--rd)' : 'var(--mu)';
  m.style.fontWeight = bad ? '700' : '400';
}

async function saveNote(){
  const v = el('wknote').value;
  NOTE = v;
  // LOCAL FIRST, ALWAYS. Whatever the server does next, the text survives.
  try { localStorage.setItem('habitnote_' + ymd(WEEK), v); } catch(e){}
  try {
    await sb('habit_notes', {method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
      body:{week_start: ymd(WEEK), note: v || null, updated_at: new Date().toISOString()}});
    NOTE_UNSAVED = false;
    noteMsg('saved', false);
    setTimeout(()=>{ if (!NOTE_UNSAVED) noteMsg('', false); }, 1600);
  } catch(e){
    NOTE_UNSAVED = true;
    // stays on screen: this is the message that was missed
    noteMsg('NOT saved to the server — kept on this device only', true);
  }
}
function noteTyped(){
  try { localStorage.setItem('habitnote_' + ymd(WEEK), el('wknote').value); } catch(e){}
  if (!NOTE_UNSAVED) noteMsg('…', false);
  clearTimeout(noteTimer);
  noteTimer = setTimeout(saveNote, 1200);
}

function val(dk, col){
  const r = DAYS[dk];
  if (!r) return (col === 'run_type') ? '' : 0;
  const v = r[col];
  if (col === 'run_type') return v || '';
  return v == null ? 0 : Number(v);
}

// Only ever writes the ONE column that changed, so nothing else on the row
// gets clobbered by a stale local copy.
async function setVal(dk, col, v){
  DAYS[dk] = {...(DAYS[dk]||{date:dk}), [col]: v};
  render();
  try {
    await sb('daily_habits', {method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
      body:{date:dk, [col]:v, updated_at:new Date().toISOString()}});
  } catch(e){
    if (e instanceof NeedSignIn) { showSignIn('Your session ended — that tap was not saved.'); return; }
    toast('Not saved — ' + e.message);
    await loadWeek(); render();
  }
}

/* ── tap semantics ───────────────────────────────────────────── */
function nextValue(row, cur){
  switch(row.kind){
    case 'toggle':  return cur ? 0 : 1;
    case 'step3':   return (Number(cur)+1) % 4;               // 0 → 🙁 → 🙂 → 😇 → 0
    case 'cycle':   return row.cycle[(row.cycle.indexOf(cur||'')+1) % row.cycle.length];
    case 'accrete': return Number(cur) + row.step;
  }
}
function clearValue(row){ return row.kind === 'cycle' ? '' : 0; }

function tapCell(dk, colIdx){
  const row = ALL_ROWS[colIdx];
  setVal(dk, row.col, nextValue(row, val(dk, row.col)));
}
function clearCell(dk, colIdx){
  const row = ALL_ROWS[colIdx];
  setVal(dk, row.col, clearValue(row));
  try { navigator.vibrate(25); } catch {}
}

/* long-press = clear. Same gesture the old tracker used. */
let lpTimer=null, lpFired=false;
function pressStart(dk, i){
  lpFired=false;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(()=>{ lpFired=true; clearCell(dk,i); }, 480);
}
function pressEnd(dk, i){
  clearTimeout(lpTimer);
  if (!lpFired) tapCell(dk,i);
}
function pressCancel(){ clearTimeout(lpTimer); lpFired=true; }

/* ── render ──────────────────────────────────────────────────── */
function cellClass(row, v, dk){
  const cls = ['cell', 'g-'+row.group];
  if (dk === TODAY) cls.push('today');
  if (dk > TODAY) cls.push('future');
  const n = row.kind === 'cycle' ? (v ? 1 : 0) : Number(v);
  if (!n) return cls.join(' ');
  if (row.risk){                                    // alcohol: escalating warmth
    cls.push('alc' + Math.min(5, n));
    return cls.join(' ');
  }
  if (row.kind === 'accrete' && row.target)
    cls.push(n >= row.target ? 'on' : 'part');
  else if (row.kind === 'step3')
    cls.push(n >= 3 ? 'on' : 'part');
  else
    cls.push('on');
  return cls.join(' ');
}

function cellInner(row, v){
  if (row.draw){ const s = row.draw(v); return s ? `<span class="v">${s}</span>` : ''; }
  if (row.kind === 'toggle') return Number(v) ? `<span class="v">✓</span>` : '';
  if (row.kind === 'accrete'){
    const n = Number(v);
    return n ? `<span class="v">${n}</span><span class="u">${row.unit}</span>` : '';
  }
  return '';
}

function render(){
  const days = Array.from({length:7}, (_,i)=>{
    const d = addDays(WEEK,i); return {d, dk: ymd(d), lbl: DAY_SHORT[i]};
  });

  el('wknav').innerHTML = `<div class="wknav">
    <button onclick="stepWeek(-1)" aria-label="Previous week">‹</button>
    <div class="lbl"><b>${ymd(WEEK)===ymd(monday(new Date())) ? 'This week' : fmtRange(WEEK)}</b>
      <span>${ymd(WEEK)===ymd(monday(new Date())) ? fmtRange(WEEK) : ''}</span></div>
    <button onclick="stepWeek(1)" aria-label="Next week">›</button></div>`;

  let h = `<div></div>` + days.map(x =>
    `<div class="gh ${x.dk===TODAY?'today':''}">${x.lbl}<br>${x.d.getDate()}</div>`).join('');

  let idx = 0;
  for (const g of GROUPS){
    h += `<div class="grouplbl" style="color:${g.tint}">${g.label}</div>`;
    for (const _r of g.rows){
      const i = idx++;
      // Take the row from ALL_ROWS, not from g.rows. Only ALL_ROWS carries
      // `group`, and without it cellClass emits "g-undefined": every colour
      // rule misses, the background stays grey, and .cell.on still applies its
      // near-black text — so a filled cell rendered as unreadable dark-on-dark.
      // `idx` is already the ALL_ROWS index; pressStart/pressEnd resolve it the
      // same way, so this removes the last place the two could drift apart.
      const row = ALL_ROWS[i];
      // Weights carries its aim (2×/wk) inline — the only place a target is shown,
      // because it is the non-negotiable one.
      const doneN = days.filter(x => !!val(x.dk, row.col)).length;
      h += `<div class="rowlbl">${row.label}${row.aim?`<span class="aim">${doneN}/2</span>`:''}</div>`;
      for (const x of days){
        const v = val(x.dk, row.col);
        h += `<button class="${cellClass(row,v,x.dk)}"
          onpointerdown="pressStart('${x.dk}',${i})"
          onpointerup="pressEnd('${x.dk}',${i})"
          onpointerleave="pressCancel()"
          onpointercancel="pressCancel()"
          oncontextmenu="return false"
          aria-label="${row.label} ${x.lbl}">${cellInner(row,v)}</button>`;
      }
    }
  }
  el('grid').innerHTML = h;
  el('hsub').textContent = fmtRange(WEEK);

  const nb = el('notebox');
  if (nb){
    // only rebuilt when the week changes, so typing is never interrupted
    if (nb.dataset.wk !== ymd(WEEK)){
      nb.dataset.wk = ymd(WEEK);
      nb.innerHTML = `<div class="notehdr">Anything worth knowing about this week
          <span id="notemsg" class="notemsg"></span></div>
        <textarea id="wknote" rows="3" placeholder="Travel, illness, a 3am flight — whatever the numbers do not say."
          oninput="noteTyped()" onblur="saveNote()"></textarea>`;
      el('wknote').value = NOTE;
      if (NOTE_UNSAVED) noteMsg('NOT saved to the server — kept on this device only', true);
    } else if (el('wknote') && document.activeElement !== el('wknote')){
      el('wknote').value = NOTE;
    }
  }
}

function stepWeek(n){ WEEK = addDays(WEEK, n*7); boot(false); }

/* ═══════════════════════════════════════════════════════════════
   BANNER — readiness + exactly one do/don't line.

   Rule-based off the readiness garmin_sync.py already computes. No
   LLM call, ever: this has to be instant and identical every time.
   Source order: the garmin_readiness table (written by James), then
   the goal-tracker Pages copy of garmin_status.js as a fallback,
   which works because GitHub Pages serves both repos on one origin.
   ═══════════════════════════════════════════════════════════════ */
async function loadReadiness(){
  // 1 · the table
  try {
    const rows = await sb('garmin_readiness?select=*&order=date.desc&limit=1');
    if (rows && rows.length) return {
      date: rows[0].date, score: rows[0].score,
      sessions: rows[0].sessions || {}, summary: rows[0].summary || '',
    };
  } catch {}
  // 2 · same-origin fallback: the static file garmin_sync.py commits
  try {
    const r = await fetch('../goal-tracker/garmin_status.js', {cache:'no-store'});
    if (r.ok){
      const txt = await r.text();
      const m = txt.match(/window\.GARMIN\s*=\s*([\s\S]*?);\s*$/);
      if (m){
        const g = JSON.parse(m[1]);
        return {date:g.date, score:(g.readiness||{}).score,
                sessions:(g.readiness||{}).sessions||{}, summary:(g.readiness||{}).summary||''};
      }
    }
  } catch {}
  return null;
}

// One line. Green light for the hardest thing that's cleared, or the
// clearest "not today" if nothing hard is.
function doDontLine(r){
  const s = r.sessions || {};
  const ok = k => s[k] && s[k].status === 'good';
  const why = k => (s[k] && s[k].reason) ? s[k].reason : '';
  if (ok('VO2 Max'))  return {t:'Green for VO2.',            e:why('VO2 Max')};
  if (ok('Tempo'))    return {t:'Green for tempo.',          e:why('Tempo')};
  if (ok('Long Run')) return {t:'Green for a long run.',     e:why('Long Run')};
  if (ok('Zone 2'))   return {t:'Not the day for tempo — Z2 only.', e:why('Zone 2')};
  if (ok('Weights'))  return {t:'Not the day for running — lift instead.', e:why('Weights')};
  if (ok('Mobility')) return {t:'Recovery day. Mobility only.', e:why('Mobility')};
  return {t:'Recovery day.', e:'Nothing is showing green.'};
}

async function renderBanner(){
  const r = await loadReadiness();
  const b = el('banner');
  if (!r || r.score == null){
    b.className = 'banner none';
    b.innerHTML = `<div class="score">—</div><div class="line">No readiness data.
      <em>garmin_sync.py hasn't reported yet.</em></div>`;
    return;
  }
  const stale = r.date !== TODAY;
  const band = r.score >= 70 ? 'good' : r.score >= 50 ? 'mid' : 'low';
  const line = doDontLine(r);
  b.className = 'banner ' + band;
  b.innerHTML = `<div class="score">${r.score}<small>READY</small></div>
    <div class="line">${line.t}<em>${line.e}${stale ? ' · from ' + r.date : ''}</em></div>`;
}

/* ── sign-in panel ───────────────────────────────────────────────
   Only seen on a device where golf-coach has never been signed in —
   in practice the home-screen copy on a phone, which keeps its own
   storage. A PASTE box, not just a link: emailed links open in the
   wrong browser on Android (see golf-coach, 31 Jul). */
const canonEmail = e => String(e||'').trim().toLowerCase().replace(/@gmail\.com$/, '@googlemail.com');

function showSignIn(msg){
  el('banner').style.display = 'none';
  el('wknav').innerHTML = ''; el('notebox').innerHTML = ''; el('notebox').dataset.wk = '';
  el('grid').innerHTML = `<div style="grid-column:1/-1;font-size:13.5px;line-height:1.55;padding:6px 0">
    <b>Sign in</b> — same account as the golf coach app.<br>
    <span style="color:var(--mu)">Signed in there on this device already? Just reload.</span>
    <input id="si-email" type="email" placeholder="email" autocomplete="email"
      value="${(localStorage.getItem('gc_email')||'').replace(/"/g,'')}"
      style="width:100%;margin:10px 0 6px;padding:9px 11px;border:1px solid var(--b2);border-radius:9px;background:var(--s2);color:var(--tx);font-size:15px">
    <button onclick="siSend()" style="padding:8px 14px;border-radius:9px;border:1px solid var(--b2);background:var(--sf);color:var(--tx)">Send code</button>
    <textarea id="si-code" rows="2" placeholder="paste the code, or the whole link from the email"
      style="width:100%;margin:12px 0 6px;padding:9px 11px;border:1px solid var(--b2);border-radius:9px;background:var(--s2);color:var(--tx);font-size:15px"></textarea>
    <button onclick="siVerify()" style="padding:8px 14px;border-radius:9px;border:1px solid var(--ac);background:var(--sf);color:var(--ac)">Sign in</button>
    <div id="si-msg" style="margin-top:10px;color:var(--mu)">${msg||''}</div></div>`;
}
function siMsg(t, bad){ const m = el('si-msg'); m.innerHTML = t; m.style.color = bad ? 'var(--rd)' : 'var(--mu)'; }

async function siSend(){
  const email = canonEmail(el('si-email').value);
  if (!email.includes('@')) return siMsg('That doesn\'t look like an email address.', true);
  siMsg('<span class="spin"></span> Sending…');
  try {
    await authFetch('otp', {email, create_user: false});
    localStorage.setItem('gc_email', email);
    siMsg('Sent to <b>'+email+'</b>. Paste the code (or the whole link) below.');
  } catch(e){ siMsg('Couldn\'t send: '+e.message, true); }
}

async function siVerify(){
  const email = canonEmail(el('si-email').value || localStorage.getItem('gc_email'));
  const v = el('si-code').value.trim();
  siMsg('<span class="spin"></span> Signing in…');
  try {
    const at = v.match(/access_token=([^&\s]+)/);
    const th = v.match(/[?&](token_hash|token)=([^&\s]+)/);
    if (at) {
      const rt = v.match(/refresh_token=([^&\s]+)/);
      writeSession({access_token: at[1], refresh_token: rt ? rt[1] : null, expires_in: 3600});
    } else if (th || /^[0-9a-f]{20,}$/i.test(v)) {
      const t = v.match(/[?&]type=([^&\s]+)/);
      writeSession(await authFetch('verify', {type: t ? t[1] : 'magiclink',
        token_hash: th ? decodeURIComponent(th[2]) : v}));
    } else if (/^[0-9]{4,12}$/.test(v)) {
      try { writeSession(await authFetch('verify', {type:'email', email, token:v})); }
      catch { writeSession(await authFetch('verify', {type:'magiclink', email, token:v})); }
    } else {
      return siMsg('That is neither the code nor the link.', true);
    }
    el('banner').style.display = '';
    boot(true);
  } catch(e){
    siMsg('That did not work: '+e.message+'<br>Verifying as <b>'+(email||'(no email)')+'</b>. A used code is spent — request a new one.', true);
  }
}

/* ── boot ────────────────────────────────────────────────────── */
async function boot(withBanner){
  try {
    await loadWeek();
    render();
  } catch(e){
    if (e instanceof NeedSignIn) { showSignIn(); return; }
    el('grid').innerHTML = `<div style="grid-column:1/-1;color:var(--rd);font-size:13px;padding:10px 0">
      Couldn't load: ${e.message}</div>`;
  }
  if (withBanner !== false) renderBanner();
}
boot(true);
</script>
